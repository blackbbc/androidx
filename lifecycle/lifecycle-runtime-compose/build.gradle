import androidx.build.LibraryType
import androidx.build.PlatformIdentifier
import androidx.build.AndroidXComposePlugin
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("AndroidXComposePlugin")
}

androidXMultiplatform {
    enableBinaryCompatibilityValidator = false

    android()
//    desktop()
//    mac()
//    linux()
    ios()
    ohosNative()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                api(libs.androidx.annotation)
                implementation(project(":lifecycle:lifecycle-common"))
                api(project(":lifecycle:lifecycle-runtime"))
                api("org.jetbrains.compose.runtime:runtime:1.6.1-KBA-006")

                implementation(libs.kotlinStdlib)
            }
        }

        nonAndroidMain.dependsOn(commonMain)
        desktopMain.dependsOn(nonAndroidMain)
        nativeMain.dependsOn(nonAndroidMain)

        targets.all { target ->
            if (target.platformType == KotlinPlatformType.native) {
                target.compilations["main"].defaultSourceSet {
                    dependsOn(nativeMain)
                }
            }
        }
    }
}

androidx {
    name = "Lifecycle Runtime Compose"
    type = LibraryType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2021"
    description = "Compose integration with Lifecycle"
    legacyDisableKotlinStrictApiMode = true
}

android {
    buildTypes.configureEach {
        consumerProguardFiles "proguard-rules.pro"
    }

    namespace "androidx.lifecycle.runtime.compose"
}
