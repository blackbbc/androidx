import androidx.build.LibraryType
import androidx.build.PlatformIdentifier
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType
import org.jetbrains.kotlin.konan.target.Family

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
}

androidXMultiplatform {
    android()
    desktop()
    mac()
    linux()
    ios()
    ohosNative()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                api(libs.kotlinStdlib)
                api(libs.androidx.annotation)
                api(project(":core:core-bundle"))
                api(project(":lifecycle:lifecycle-common"))
            }
        }

        jvmMain {
            dependsOn(commonMain)

            dependencies {
                api("androidx.arch.core:core-common:2.2.0")
            }
        }

        desktopMain.dependsOn(jvmMain)
        androidMain.dependsOn(jvmMain)

        androidInstrumentedTest {
//            dependsOn(jvmTest)
//            dependencies {
//                implementation(projectOrArtifact(":lifecycle:lifecycle-runtime"))
//                implementation(libs.testExtJunit)
//                implementation(libs.testCore)
//                implementation(libs.testRunner)
//                implementation(libs.testRules)
//                implementation(libs.truth)
//            }
        }

        nonJvmMain.dependsOn(commonMain)

        targets.all { target ->
            if (target.platformType !in [
                    KotlinPlatformType.androidJvm,
                    KotlinPlatformType.jvm,
                    KotlinPlatformType.common
            ]) {
                target.compilations["main"].defaultSourceSet {
                    dependsOn(nonJvmMain)
                }
            }
        }
    }
}

android {
    buildTypes.configureEach {
        consumerProguardFiles("proguard-rules.pro")
    }
    namespace "androidx.savedstate"
}

androidx {
    name = "Saved State"
    type = LibraryType.PUBLISHED_LIBRARY
    inceptionYear = "2018"
    description = "Android Lifecycle Saved State"
    metalavaK2UastEnabled = true
    legacyDisableKotlinStrictApiMode = true
}
